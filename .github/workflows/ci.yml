name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/netflow
      - name: Check release packaging
        run: |
          bash scripts/build-release.sh v0.0.0-ci
          cd dist/v0.0.0-ci
          sha256sum --check checksums.txt
      - name: Build container
        run: docker build -t netflow:ci .
