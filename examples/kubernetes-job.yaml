apiVersion: batch/v1
kind: Job
metadata:
  name: netflow-outbound
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: netflow # Adjust to match the intended NetworkPolicy selection.
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netflow
          image: YOUR_REGISTRY/netflow:dev # Build and push your image first.
          args:
            - test
            - --config
            - /config/network-flows.yaml
            - --vantage
            - aks-app
            - --group
            - FW-GROUP-001
            - --output
            - json
          env:
            - name: NETFLOW_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NETFLOW_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NETFLOW_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NETFLOW_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: netflow-config
