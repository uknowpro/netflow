version: 1
defaults:
  timeout: 5s
  retries: 0
flows:
  - id: vm-internal-app
    group: azure-vm
    direction: inbound
    vantage: azure-vm
    source_environment: vm
    protocol: https
    url: https://app.internal.example/health
    expect:
      status: [200]
    expected_path:
      - type: nsg
        name: vm-subnet-nsg
      - type: application_gateway
        name: internal-appgw
      - type: nsg
        name: aks-subnet-nsg
